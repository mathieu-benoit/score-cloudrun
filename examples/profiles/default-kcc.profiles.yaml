- id: default-kcc
  name: default
  format: kcc
  description: Defines the default Workload profile as Cloud Run Service with Config Connector.
  manifests: |
    {{- $workloadName := .WorkloadName }}
    apiVersion: run.cnrm.cloud.google.com/v1beta1
    kind: RunService
    metadata:
      name: {{ $workloadName }}
    spec:
      ingress: "INGRESS_TRAFFIC_ALL"
      location: {{ .Location }}
      projectRef:
        name: {{ .ProjectId }}
      template:
        containers:
        {{- range $containerName, $container := .Spec.Containers }}
        - name: string
          image: {{ $container.Image }}
          {{- if (gt (len $container.Args) 0) }}
          args:
          {{- range $i, $arg := $container.Args }}
          - {{ $arg }}
          {{- end }}
          {{- end }}
          {{- if (gt (len $container.Command) 0) }}
          command:
          {{- range $i, $command := $container.Command }}
          - {{ $command }}
          {{- end }}
          {{- end }}
          {{- if (gt (len $container.Variables) 0) }}
          env:
          {{- range $variableName, $variableValue := $container.Variables }}
          - name: {{ $variableName }}
            value: {{ $variableValue }}
          {{- end }}
          {{- end }}
          
          {{- if and (ne $container.LivenessProbe nil)  (ne $container.LivenessProbe.HttpGet nil) }}
          livenessProbe:
            httpGet:
              {{- if (ne $container.LivenessProbe.HttpGet.Path "") }}
              path: {{ $container.LivenessProbe.HttpGet.Path }}
              {{- end }}
              {{- if (ne $container.LivenessProbe.HttpGet.Port 0) }}
              port: {{ $container.LivenessProbe.HttpGet.Port }}
              {{- end}}
            }
          }
          {{- end }}
        {{- end }}
        serviceAccountRef:
          name: {{ $workloadName }}
        vpcAccess:
          networkInterfaces:
          - networkRef:
              name: default
            subnetworkRef:
              name: default
    ---
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    metadata:
      name: {{ $workloadName }}