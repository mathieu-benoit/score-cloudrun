- id: default-terraform
  name: default
  format: terraform
  description: Defines the default Workload profile as Cloud Run Service with Terraform.
  manifests: |
    resource "google_project_service" "secretmanager" {
      project = "{{ .ProjectId }}"
      service = "secretmanager.googleapis.com"
    }

    data "google_project" "project" {
    }
    
    {{- $workloadName := .WorkloadName }}{{- $exposedRouteEnabled := false }}
    locals {
      network = "default"
    }
    {{- range $resourceName, $resource := .Spec.Resources }}{{- if eq $resource.Type "route" }}{{- $exposedRouteEnabled := true }}{{- end }}{{- end }}
    resource "google_cloud_run_v2_service" "{{ $workloadName }}" {
      provider = {{ if not $exposedRouteEnabled }}google-beta{{ else }}google{{ end }}
      project = "{{ .ProjectId }}"
      location = "{{ .Location }}"
      name     = "{{ $workloadName }}"
      deletion_protection = false
      ingress = "INGRESS_TRAFFIC_ALL"
      {{- if not $exposedRouteEnabled }}
      default_uri_disabled = {{ not $exposedRouteEnabled }}
      {{- end }}

      {{- if ne .BuildConfig.SourcePath "" }}
      build_config {
        source_location = "gs://${google_storage_bucket.{{ $workloadName }}_source.name}/${google_storage_bucket_object.{{ $workloadName }}_source.name}"
        function_target = "{{ .BuildConfig.FunctionName }}"
        image_uri = "{{ .Image }}"
        base_image = "us-central1-docker.pkg.dev/serverless-runtimes/google-22-full/runtimes/{{ .BuildConfig.BaseImage }}"
        enable_automatic_updates = true
        service_account = google_service_account.{{ $workloadName }}_build.id
      }
      {{- end }}

      template {
        service_account = google_service_account.{{ $workloadName }}.email

        {{- range $containerName, $container := .Spec.Containers }}
        containers {
          name  = "{{ $containerName }}"
          image = "{{ $container.Image }}"
          
          {{- range $variableName, $variableValue := $container.Variables }}
          env {
            name = "{{ $variableName }}"
            value = "{{ $variableValue }}"
          }{{- end }}

          {{- if (gt (len $container.Command) 0) }}
          command = [
            {{- range $i, $cmd := $container.Command }}
            "{{ $cmd }}"{{ if (gt (len $container.Command) $i) }},{{ end }}
            {{- end }}
          ]
          {{- end }}

          {{- if (gt (len $container.Args) 0) }}
          args = [
            {{- range $i, $arg := $container.Args }}
            "{{ $arg }}"{{ if (gt (len $container.Args) $i) }},{{ end }}
            {{- end }}
          ]{{- end }}

          {{- if and (ne $container.LivenessProbe nil)  (ne $container.LivenessProbe.HttpGet nil) }}
          liveness_probe {
            http_get {
              {{- if (ne $container.LivenessProbe.HttpGet.Path "") }}
              path = "{{ $container.LivenessProbe.HttpGet.Path }}"
              {{- end }}
              {{- if (ne $container.LivenessProbe.HttpGet.Port 0) }}
              port = {{ $container.LivenessProbe.HttpGet.Port }}
              {{- end}}
            }
          }
          {{- end }}
        }
        {{- end }}
        vpc_access {
          network_interfaces {
            network    = local.network
            subnetwork = local.network
          }
        }
      }
    }

    resource "google_service_account" "{{ $workloadName }}" {
      project = "{{ .ProjectId }}"
      account_id = "{{ $workloadName }}"
    }
    
    {{- if ne .BuildConfig.SourcePath "" }}
    resource "google_storage_bucket" "{{ $workloadName }}_source" {
      name     = data.google_project.project.project_id-{{ $workloadName }}-source
      location = "US"
      uniform_bucket_level_access = true
    }
    resource "google_storage_bucket_object" "{{ $workloadName }}_source" {
      name   = "{{ .BuildConfig.SourcePath }}"
      bucket = google_storage_bucket.{{ $workloadName }}_source.name
      source = "{{ .BuildConfig.SourcePath }}"
    }
    resource "google_service_account" "{{ $workloadName }}_build" {
      account_id = "{{ $workloadName }}_build"
    }
    resource "google_project_iam_member" "{{ $workloadName }}_build_act_as" {
      project = data.google_project.project.project_id
      role    = "roles/iam.serviceAccountUser"
      member  = "serviceAccount:${google_service_account.{{ $workloadName }}_build.email}"
    }
    resource "google_project_iam_member" "{{ $workloadName }}_build_logs_writer" {
      project = data.google_project.project.project_id
      role    = "roles/logging.logWriter"
      member  = "serviceAccount:${google_service_account.{{ $workloadName }}_build.email}"
    }
    {{- end }}