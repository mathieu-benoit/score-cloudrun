- uri: default-kcc://default-provisioners/cloud-sql-postgres
  type: postgres
  class: default
  format: kcc
  description: Generates a Cloud SQL (PostgreSQL) instance and database Config Connector resource
  outputs:
    host: fixme
    database: fixme
    port: 5432
    username: fixme
    password: fixme
  manifests: |
    ---
    apiVersion: sql.cnrm.cloud.google.com/v1beta1
    kind: SQLDatabase
    metadata:
      name: database-fixme
    spec:
      instanceRef:
        name: instance-fixme
    ---
    apiVersion: sql.cnrm.cloud.google.com/v1beta1
    kind: SQLInstance
    metadata:
      name: instance-fixme
    spec:
      region: {{ .Location }}
      databaseVersion: POSTGRES_14
      settings:
        tier: db-g1-small
    ---
    apiVersion: sql.cnrm.cloud.google.com/v1beta1
    kind: SQLUser
    metadata:
      name: user-fixme
    spec:
      instanceRef:
        name: instance-fixme
      password: fixme