- uri: default-terraform://default-provisioners/memorystore-redis
  type: redis
  description: Generates a Memorystore (Redis) Terraform resource.
  outputs: |
    host: google_redis_instance.memorystore.host
    port: google_redis_instance.memorystore.port
    username: ""
    password: "${google_redis_instance.memorystore.auth_string}"
  manifests: |
    variable "network" {
      type    = string
      default = "default"
    }

    resource "random_string" "memorystore_instance_name" {
      length  = 10
      special = false
      lower   = true
      upper   = false
    }

    resource "google_redis_instance" "memorystore" {
      name               = "redis-${random_string.memorystore_instance_name.result}"
      memory_size_gb     = 1
      redis_version      = "REDIS_7_2"
      region             = "{{ .Location }}"
      auth_enabled       = true
      authorized_network = data.google_compute_network.vpc.id
    }

    data "google_compute_network" "vpc" {
      name = var.network
    }