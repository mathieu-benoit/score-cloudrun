- uri: default-terraform://default-provisioners/external-dns
  type: dns
  class: external
  description: Makes the Cloud Run Service publicly available
  outputs:
    host: "${google_cloud_run_v2_service.example.uri}"
  manifests: |
    data "google_iam_policy" "noauth" {
      binding {
        role = "roles/run.invoker"
        members = [
          "allUsers",
        ]
      }
    }

    resource "google_cloud_run_service_iam_policy" "noauth" {
      location = "{{ .Location }}"
      service  = google_cloud_run_v2_service.example.name

      policy_data = data.google_iam_policy.noauth.policy_data
    }