- uri: default-kcc://default-provisioners/external-dns
  type: dns
  class: external
  format: kcc
  description: Makes the Cloud Run Service publicly available
  outputs:
    host: fixme
  manifests: |
    ---
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMPolicyMember
    metadata:
      name: my-service-invoker
      namespace: my-namespace
    spec:
      member: allUsers
      role: roles/run.invoker
      resourceRef:
        kind: RunService
        name: example